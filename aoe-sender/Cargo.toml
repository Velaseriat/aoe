[package]
name = "aoe-sender"
version = "0.1.0"
edition = "2021"
description = "AOE sender (Beta): captures system audio and streams to Alpha"

[[bin]]
name = "aoe-sender"
path = "src/main.rs"

[dependencies]
aoe-protocol = { path = "../aoe-protocol" }
wasapi = "0.22"
bytes = "1.5"
tao = "0.31"
tray-icon = "0.21"
image = "0.25"
winapi = { version = "0.3", features = ["shellapi", "winuser"] }
